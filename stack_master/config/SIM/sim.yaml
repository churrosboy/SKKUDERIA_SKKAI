bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'car_state'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_pose_topic: 'pose' 
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.27

    # laserscan parameters
    # 2026-08-25: real GL-5 = 270 deg, 1500 beams (0.18 deg), 40 Hz, effective ~6 m
    # scan_fov: 4.7
    # scan_beams: 1080
    scan_fov: 4.712
    scan_beams: 1500
    scan_range_max: 6.0
    scan_rate_hz: 40.0
    # 2026-08-25: real car publish rates -> carstate_node 80 Hz, cartographer TF 200 Hz
    odom_rate_hz: 80.0
    tf_rate_hz: 200.0

    # map parameters
    map_img_ext: '.png'

    # opponent parameters
    # num_agent: 1
    num_agent: 2   # 2026-08-25 hh test: static opp on the straight at s~10 m

    # ego starting pose on map
    # 2026-08-25: start pose = maps/latest/latest.yaml initial_pose (old values commented)
    # sx: 0.5
    # sy: 1.25
    # stheta: -0.7
    sx: -2.909
    sy: 5.003
    stheta: 3.138

    # opp starting pose on map
    # sx1: 2.0
    # sy1: 0.5
    # stheta1: 0.0
    sx1: 6.65
    sy1: 5.11
    stheta1: -3.13

    # teleop
    kb_teleop: True

# 2026-08-25: dynamic opponent (gym opp car) -- only used when bridge.num_agent == 2
opp_driver:
  ros__parameters:
    enable: true
    speed_mps: 1.5          # constant speed [m/s]; set speed_scale > 0 to follow the raceline profile instead
    speed_scale: 0.0        # e.g. 0.5 = half the raceline vx
    lateral_offset_m: 0.0   # +left / -right of raceline
    lookahead_m: 1.2
    lookahead_gain_s: 0.25
    start_delay_s: 0.0
    stop_after_s: 0.0       # >0: park after N s (static obstacle mid-track)
