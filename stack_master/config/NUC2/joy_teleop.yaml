joy:
  ros__parameters:
    #device_name: /dev/input/js0
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 100.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    # 2026-08-11: default block disabled. It published zero-speed to `teleop`
    # (mux priority 100) whenever no button was held, which blocked autonomous
    # `drive` commands unless RB(5) was held to suppress it. Autonomy enable is
    # now a press-toggle on RB handled by the autonomy_toggle node + mux lock.
    # default:
    #   type: topic
    #   interface_type: ackermann_msgs/msg/AckermannDriveStamped
    #   topic_name: teleop
    #   axis_mappings:
    #     drive-speed:
    #       axis: 1
    #       scale: 0.0
    #       offset: 0.0
    #     drive-steering_angle:
    #       axis: 2
    #       scale: 0.0
    #       offset: 0.0

    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [4]
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 5.0
          offset: 0.0
        drive-steering_angle:
          axis: 3
          scale: 0.34
          offset: 0.0

    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /dev/null
      deadman_buttons: [5]
      message_value:
        data:
          value: 0
